name: thermal-chipletpart
channels:
  - conda-forge
dependencies:
  # C++17 build toolchain and libraries used directly by CMakeLists.txt.
  - cmake>=3.14
  - ninja
  - make
  - c-compiler
  - cxx-compiler
  - boost-cpp>=1.71
  - eigen>=3.4

